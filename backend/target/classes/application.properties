# ─────────────────────────────────────────────────────────────────────────────
# Required environment variables
# ─────────────────────────────────────────────────────────────────────────────
# DATABASE_URL  — full JDBC URL for the PostgreSQL database
#                 e.g. jdbc:postgresql://localhost:5432/simplemessenger
# DB_USERNAME   — PostgreSQL username
# DB_PASSWORD   — PostgreSQL password
# JWT_SECRET    — secret key used to sign / verify JWT tokens
# JWT_EXPIRY_MS — token lifetime in milliseconds (default: 3 600 000 = 1 hour)
# BASE_URL      — base URL prepended to Location headers in 201 responses
#                 e.g. http://localhost:8080/v1
# ─────────────────────────────────────────────────────────────────────────────

# DataSource
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate — schema is managed by Flyway; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:3600000}

# Application base URL (used to construct Location headers)
app.base-url=${BASE_URL:http://localhost:8080/v1}

# Servlet context path — all routes are served under /v1
server.servlet.context-path=/v1
