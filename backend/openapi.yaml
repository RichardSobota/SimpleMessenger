openapi: 3.0.3
info:
  title: Simple Messenger API
  version: 1.0.0
  description: A simple messenger API for managing users and messages.
  contact:
    name: Simple Messenger API Support
    email: support@simplemessenger.example.com
    url: https://simplemessenger.example.com/support

servers:
  - url: https://api.simplemessenger.example.com/v1

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Jane"
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Doe"
        email:
          type: string
          format: email
          example: "jane.doe@example.com"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2024-06-01T12:00:00+00:00"
        followers:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          readOnly: true
      required:
        - id
        - firstName
        - lastName
        - email
        - createdAt
        - followers

    UserSummary:
      type: object
      description: A lightweight representation of a User used in nested contexts (e.g. followers list) to avoid circular references.
      properties:
        id:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Smith"
        email:
          type: string
          format: email
          example: "john.smith@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2024-05-15T09:30:00+00:00"
      required:
        - id
        - firstName
        - lastName
        - email
        - createdAt

    CreateUserRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Jane"
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Doe"
        email:
          type: string
          format: email
          example: "jane.doe@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 24
          format: password
          example: "S3cur3P@ss!"
      required:
        - firstName
        - lastName
        - email
        - password

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Janet"
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Doe"
        email:
          type: string
          format: email
          example: "janet.doe@example.com"

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: "c3d4e5f6-a7b8-9012-cdef-123456789012"
        user:
          type: string
          format: uuid
          description: The UUID of the User who sent the message.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        messageText:
          type: string
          example: "Hello, world!"
        sentAt:
          type: string
          format: date-time
          readOnly: true
          example: "2024-06-01T13:45:00+00:00"
      required:
        - id
        - user
        - messageText
        - sentAt

    CreateMessageRequest:
      type: object
      properties:
        user:
          type: string
          format: uuid
          description: The UUID of the User sending the message.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        messageText:
          type: string
          minLength: 1
          example: "Hello, world!"
      required:
        - user
        - messageText

    PagedMessages:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        page:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3
      required:
        - data
        - page
        - pageSize
        - totalElements
        - totalPages

    ValidationError:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "email"
              issue:
                type: string
                example: "must be a valid email address"
      required:
        - status
        - error
        - message

    ConflictError:
      type: object
      properties:
        status:
          type: integer
          example: 409
        error:
          type: string
          example: "Conflict"
        message:
          type: string
          example: "A user with this email already exists"
      required:
        - status
        - error
        - message

    NotFoundError:
      type: object
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Resource not found"
      required:
        - status
        - error
        - message

    UnauthorizedError:
      type: object
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "Authentication token is missing or invalid"
      required:
        - status
        - error
        - message

  responses:
    UnauthorizedResponse:
      description: Missing or invalid JWT token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
          example:
            status: 401
            error: "Unauthorized"
            message: "Authentication token is missing or invalid"

    NotFoundResponse:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
          example:
            status: 404
            error: "Not Found"
            message: "Resource not found"

paths:

  # ─────────────────────────────────────────
  # User Endpoints
  # ─────────────────────────────────────────

  /users:
    post:
      summary: Create a new user
      description: Registers a new user. This endpoint is public and does not require authentication.
      operationId: createUser
      security: []
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              firstName: "Jane"
              lastName: "Doe"
              email: "jane.doe@example.com"
              password: "S3cur3P@ss!"
      responses:
        '201':
          description: User created successfully.
          headers:
            Location:
              description: URL of the newly created user.
              schema:
                type: string
                format: uri
              example: "https://api.simplemessenger.example.com/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                firstName: "Jane"
                lastName: "Doe"
                email: "jane.doe@example.com"
                createdAt: "2024-06-01T12:00:00+00:00"
                followers: []
        '400':
          description: Validation error — one or more fields are invalid or missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                status: 400
                error: "Bad Request"
                message: "Validation failed"
                details:
                  - field: "email"
                    issue: "must be a valid email address"
                  - field: "password"
                    issue: "must be between 8 and 24 characters"
        '409':
          description: Conflict — a user with the provided email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
              example:
                status: 409
                error: "Conflict"
                message: "A user with this email already exists"

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: UUID of the user.
        schema:
          type: string
          format: uuid
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    get:
      summary: Get user details by ID
      description: Retrieves the full profile of a user including their followers list.
      operationId: getUserById
      tags:
        - Users
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                firstName: "Jane"
                lastName: "Doe"
                email: "jane.doe@example.com"
                createdAt: "2024-06-01T12:00:00+00:00"
                followers:
                  - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    firstName: "John"
                    lastName: "Smith"
                    email: "john.smith@example.com"
                    createdAt: "2024-05-15T09:30:00+00:00"
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    patch:
      summary: Update user details by ID
      description: Partially updates a user's profile. Only the fields provided in the request body will be changed.
      operationId: updateUserById
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              firstName: "Janet"
              lastName: "Doe"
              email: "janet.doe@example.com"
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                firstName: "Janet"
                lastName: "Doe"
                email: "janet.doe@example.com"
                createdAt: "2024-06-01T12:00:00+00:00"
                followers: []
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                status: 400
                error: "Bad Request"
                message: "Validation failed"
                details:
                  - field: "firstName"
                    issue: "must not be blank"
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict — the new email is already used by another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
              example:
                status: 409
                error: "Conflict"
                message: "A user with this email already exists"

    delete:
      summary: Delete a user by ID
      description: Permanently deletes the user with the given ID. This action is irreversible.
      operationId: deleteUserById
      tags:
        - Users
      responses:
        '204':
          description: User deleted successfully. No content returned.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /users/{userId}/followers:
    parameters:
      - name: userId
        in: path
        required: true
        description: UUID of the user to follow/unfollow.
        schema:
          type: string
          format: uuid
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    post:
      summary: Add a follower to a user by follower ID
      description: Adds the specified follower to the target user's followers list.
      operationId: addFollower
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                followerId:
                  type: string
                  format: uuid
                  description: UUID of the user who will follow the target user.
                  example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
              required:
                - followerId
            example:
              followerId: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
      responses:
        '200':
          description: Follower added. Returns the updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                firstName: "Jane"
                lastName: "Doe"
                email: "jane.doe@example.com"
                createdAt: "2024-06-01T12:00:00+00:00"
                followers:
                  - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    firstName: "John"
                    lastName: "Smith"
                    email: "john.smith@example.com"
                    createdAt: "2024-05-15T09:30:00+00:00"
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                status: 400
                error: "Bad Request"
                message: "Validation failed"
                details:
                  - field: "followerId"
                    issue: "must be a valid UUID"
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /users/{userId}/followers/{followerId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: UUID of the user being followed.
        schema:
          type: string
          format: uuid
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      - name: followerId
        in: path
        required: true
        description: UUID of the follower to remove.
        schema:
          type: string
          format: uuid
        example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"

    delete:
      summary: Remove a follower from a user by follower ID
      description: Removes the specified follower from the target user's followers list.
      operationId: removeFollower
      tags:
        - Users
      responses:
        '204':
          description: Follower removed successfully. No content returned.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  # ─────────────────────────────────────────
  # Message Endpoints
  # ─────────────────────────────────────────

  /messages:
    get:
      summary: Get all messages (pageable)
      description: Returns a paginated list of all messages across all users. Use the page and pageSize query parameters to control pagination.
      operationId: getMessages
      tags:
        - Messages
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: pageSize
          in: query
          required: false
          description: Number of messages per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Paginated list of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessages'
              example:
                data:
                  - id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                    user: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    messageText: "Hello, world!"
                    sentAt: "2024-06-01T13:45:00+00:00"
                  - id: "d4e5f6a7-b8c9-0123-defa-234567890123"
                    user: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    messageText: "Hey there!"
                    sentAt: "2024-06-01T14:00:00+00:00"
                page: 0
                pageSize: 20
                totalElements: 2
                totalPages: 1
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

    post:
      summary: Create a new message
      description: Creates a new message attributed to the specified user. The sentAt timestamp is set by the server.
      operationId: createMessage
      tags:
        - Messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
            example:
              user: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              messageText: "Hello, world!"
      responses:
        '201':
          description: Message created successfully.
          headers:
            Location:
              description: URL of the newly created message.
              schema:
                type: string
                format: uri
              example: "https://api.simplemessenger.example.com/v1/messages/c3d4e5f6-a7b8-9012-cdef-123456789012"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                user: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                messageText: "Hello, world!"
                sentAt: "2024-06-01T13:45:00+00:00"
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                status: 400
                error: "Bad Request"
                message: "Validation failed"
                details:
                  - field: "messageText"
                    issue: "must not be blank"
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: The referenced user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              example:
                status: 404
                error: "Not Found"
                message: "User not found"

  /messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        required: true
        description: UUID of the message.
        schema:
          type: string
          format: uuid
        example: "c3d4e5f6-a7b8-9012-cdef-123456789012"

    get:
      summary: Get message details by message ID
      description: Retrieves the full details of a single message by its unique identifier.
      operationId: getMessageById
      tags:
        - Messages
      responses:
        '200':
          description: Message found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                user: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                messageText: "Hello, world!"
                sentAt: "2024-06-01T13:45:00+00:00"
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    delete:
      summary: Delete a message by ID
      description: Permanently deletes the message with the given ID. This action is irreversible.
      operationId: deleteMessageById
      tags:
        - Messages
      responses:
        '204':
          description: Message deleted successfully. No content returned.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /users/{userId}/messages:
    parameters:
      - name: userId
        in: path
        required: true
        description: UUID of the user whose messages to retrieve.
        schema:
          type: string
          format: uuid
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    get:
      summary: Get all messages sent by a specific user
      description: Returns a paginated list of all messages sent by the specified user.
      operationId: getMessagesForUser
      tags:
        - Messages
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: pageSize
          in: query
          required: false
          description: Number of messages per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Paginated list of messages for the specified user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessages'
              example:
                data:
                  - id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                    user: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    messageText: "Hello, world!"
                    sentAt: "2024-06-01T13:45:00+00:00"
                page: 0
                pageSize: 20
                totalElements: 1
                totalPages: 1
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

tags:
  - name: Users
    description: Operations related to user management.
  - name: Messages
    description: Operations related to messages.
