# ─────────────────────────────────────────────────────────────────────────────
# Test profile — uses Testcontainers to spin up a real PostgreSQL 15 instance.
# The jdbc:tc: prefix is handled by the Testcontainers JDBC driver; no external
# database is required when this profile is active.
# ─────────────────────────────────────────────────────────────────────────────

# Testcontainers PostgreSQL JDBC URL
spring.datasource.url=jdbc:tc:postgresql:15:///testdb
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Flyway — apply migrations against the Testcontainers database
spring.flyway.enabled=true

# JWT — hardcoded secret used only in tests (not a real secret)
app.jwt.secret=test-secret-key-for-tests-only-minimum-32-chars!!
app.jwt.expiry-ms=3600000

# BCrypt — reduced work factor for faster test execution
bcrypt.rounds=4

# Base URL for Location headers in tests
app.base-url=http://localhost:8080/v1
